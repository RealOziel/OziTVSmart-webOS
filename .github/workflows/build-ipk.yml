name: Build OziTV webOS IPK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install webOS CLI
        run: |
          npm install -g @webosose/ares-cli || npm install -g @enact/cli
      - name: Package IPK
        run: |
          ares-package com.oziel.ozitvsmart -o build
      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: OziTVSmart-IPK
          path: build/*.ipk
